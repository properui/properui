name: Deploy docs

# Deploys apps/docs to Cloudflare Workers (worker `properui-docs`, https://properui.dev)
# via the OpenNext Cloudflare adapter.
#
# Required repository secrets (Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   — API token with the "Edit Cloudflare Workers" template permissions
#                            (Account: Workers Scripts:Edit, Account: Account Settings:Read,
#                            User: Memberships:Read; add Zone: Workers Routes:Edit and
#                            Zone: DNS:Edit once the properui.dev custom domains are enabled).
#   CLOUDFLARE_ACCOUNT_ID  — the account ID from the Cloudflare dashboard sidebar.
#
# No other secrets are needed. See apps/docs/DEPLOYMENT.md.

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-docs
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            # Node 22, not the 20 that ci.yml uses: wrangler 4 refuses to run on Node 20.
            - uses: actions/setup-node@v4
              with: { node-version: 22, cache: pnpm }

            - run: pnpm install --frozen-lockfile

            # Workspace packages the docs site reads at build time (@properui/ui) and the
            # component registry the /r/*.json routes are prerendered from.
            - run: pnpm build:packages
            - run: pnpm registry:build

            # `next build` followed by the OpenNext transform into .open-next/.
            - run: pnpm -F docs cf:build
              env:
                  NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}

            # `opennextjs-cloudflare deploy`, not `wrangler deploy`: it runs populateCache
            # first, which copies the prerendered pages and /r/*.json payloads into
            # .open-next/assets/cdn-cgi/_next_cache. Next.js resolves a prerendered route
            # through the incremental cache, so a bare `wrangler deploy` ships a site where
            # every route but `/` answers 404.
            - name: Deploy to Cloudflare Workers
              run: pnpm -F docs cf:deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
