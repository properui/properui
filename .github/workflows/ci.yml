name: CI
on:
    push: { branches: [main] }
    pull_request:
jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with: { node-version: 20, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm type-check
            - run: pnpm lint
            - run: pnpm prettier:check
            - run: pnpm test
            - run: pnpm check:assets
            - run: pnpm build
            - run: pnpm build-storybook
    clean-room:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with: { node-version: 20, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            # Node 20's bundled npm (10.8.x) crashes with "Cannot read properties of null (reading 'edgesOut')"
            # on the current create-vite template graph (seen 16 Oct 2026); npm 12 installs it cleanly.
            - run: npm install -g npm@latest
            - run: pnpm test:clean-room
    # Compares a curated ~25-route sample of the docs site (tests/visual/routes.ts) against the
    # committed baseline (tests/visual/baseline/). Needs the docs site built and served on
    # localhost:3000 first — scripts/visual-check.ts talks to it over HTTP like scripts/shot.ts does.
    #
    # tests/visual/baseline/ is captured on Linux only (see tests/visual/README.md) — it must match
    # this runner's OS or every capture reports platform font-rendering noise, not real diffs. If
    # this job starts failing across many/all routes at once (rather than one specific route you
    # just changed), the baseline was probably captured on macOS by mistake; regenerate it with the
    # documented Docker command in tests/visual/README.md, don't raise the threshold to compensate.
    visual:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with: { node-version: 20, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            # Through turbo, not `pnpm -F docs build`: the landing page imports
            # packages/registry/dist/stats.json, and only the task graph knows to build the
            # registry first. Running next build directly fails with "Can't resolve
            # ../../../../packages/registry/dist/stats.json" on a clean checkout.
            - run: pnpm exec turbo run build --filter=docs...
            - run: pnpm -F docs start &
            - run: npx wait-on@8 http://localhost:3000 --timeout 60000
            - run: pnpm visual:check
            - if: failure()
              uses: actions/upload-artifact@v4
              with: { name: visual-diff, path: tests/visual/.diff/ }
