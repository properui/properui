<!-- description: A radio group in a fieldset: native arrow-key movement, sm size with hints. -->
<fieldset class="pui-radio-group">
    <legend>Plan</legend>
    <label class="pui-radio">
        <input type="radio" name="plan" value="basic" checked aria-describedby="radio-basic-hint" />
        <span class="pui-radio__box" aria-hidden="true"></span>
        <span class="pui-radio__text">
            <span class="pui-radio__label">Basic plan</span>
            <span class="pui-radio__hint" id="radio-basic-hint">Up to 10 users and 20 GB.</span>
        </span>
    </label>
    <label class="pui-radio">
        <input type="radio" name="plan" value="business" aria-describedby="radio-business-hint" />
        <span class="pui-radio__box" aria-hidden="true"></span>
        <span class="pui-radio__text">
            <span class="pui-radio__label">Business plan</span>
            <span class="pui-radio__hint" id="radio-business-hint">Up to 20 users and 40 GB.</span>
        </span>
    </label>
</fieldset>
