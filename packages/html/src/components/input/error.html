<!-- An invalid field: aria-invalid="true" on the input switches the ring to the error colour, and the message is linked with aria-describedby. -->
<div class="pui-field">
    <label class="pui-label" for="input-username">Username</label>
    <input class="pui-input" id="input-username" name="username" type="text" value="olivia rhye" aria-invalid="true" aria-describedby="input-username-error" />
    <p class="pui-error" id="input-username-error">Usernames cannot contain spaces.</p>
</div>
