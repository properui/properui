<!-- Small and large inputs (md is the default). -->
<div class="pui-field">
    <label class="pui-label" for="input-sm">Small</label>
    <input class="pui-input pui-input--sm" id="input-sm" type="text" placeholder="Small input" />
</div>
<div class="pui-field">
    <label class="pui-label" for="input-lg">Large</label>
    <input class="pui-input pui-input--lg" id="input-lg" type="text" placeholder="Large input" />
</div>
<div class="pui-field">
    <label class="pui-label" for="input-disabled">Disabled</label>
    <input class="pui-input" id="input-disabled" type="text" value="Read only value" disabled />
</div>
