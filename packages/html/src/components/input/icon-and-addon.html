<!-- A leading icon and a leading text addon, each inside a .pui-field__control row. -->
<div class="pui-field">
    <label class="pui-label" for="input-search">Search</label>
    <div class="pui-field__control">
        <svg
            class="pui-field__icon-leading"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <path d="m21 21-3.5-3.5m2.5-6a8.5 8.5 0 1 1-17 0 8.5 8.5 0 0 1 17 0Z" />
        </svg>
        <input class="pui-input" id="input-search" name="q" type="search" placeholder="Search projects" />
    </div>
</div>
<div class="pui-field">
    <label class="pui-label" for="input-website">Website</label>
    <div class="pui-field__control">
        <span class="pui-field__addon">https://</span>
        <input class="pui-input" id="input-website" name="website" type="text" placeholder="www.example.com" />
    </div>
</div>
