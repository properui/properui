<!-- description: Text inputs with a label, hint text, an error state, a leading icon and a text addon. -->
<div class="pui-field">
    <label class="pui-label" for="input-email">Email <span class="pui-label__required" aria-hidden="true">*</span></label>
    <input
        class="pui-input"
        id="input-email"
        name="email"
        type="email"
        placeholder="olivia@example.com"
        autocomplete="email"
        required
        aria-describedby="input-email-hint"
    />
    <p class="pui-hint" id="input-email-hint">We only use this to send receipts.</p>
</div>
