<!-- description: Toasts: data-pui-toast buttons (or ProperUI.toast({ title, description, variant, duration }) from script) show a notification in a polite live region that dismisses itself. -->
<button
    class="pui-btn pui-btn--secondary"
    type="button"
    data-pui-toast="Changes saved"
    data-pui-toast-description="Your profile is now live."
    data-pui-toast-variant="success"
>
    Save changes
</button>
<button
    class="pui-btn pui-btn--secondary"
    type="button"
    data-pui-toast="Upload failed"
    data-pui-toast-description="The file is larger than 25 MB."
    data-pui-toast-variant="error"
>
    Upload file
</button>
<button class="pui-btn pui-btn--secondary" type="button" data-pui-toast="Storage almost full" data-pui-toast-variant="warning" data-pui-toast-duration="0">
    Check storage
</button>
