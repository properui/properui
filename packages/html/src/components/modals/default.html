<button class="pui-btn pui-btn--primary" type="button" data-pui-modal-open="modal-invite">Invite teammates</button>

<dialog class="pui-modal pui-modal--sm" id="modal-invite">
    <div class="pui-modal__header">
        <div class="pui-modal__icon">
            <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path
                    d="M22 21v-2a4.002 4.002 0 0 0-3-3.874M15.5 3.291a4.001 4.001 0 0 1 0 7.418M17 21c0-1.864 0-2.796-.305-3.53a4 4 0 0 0-2.164-2.165C13.796 15 12.864 15 11 15H8c-1.864 0-2.796 0-3.53.305a4 4 0 0 0-2.166 2.164C2 18.204 2 19.136 2 21M13.5 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"
                />
            </svg>
        </div>
        <h2 class="pui-modal__title">Invite teammates</h2>
        <p class="pui-modal__description">They will get an email with a link to join this workspace.</p>
        <button class="pui-modal__close" type="button" aria-label="Close" data-pui-modal-close>
            <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M18 6 6 18M6 6l12 12" />
            </svg>
        </button>
    </div>
    <form class="pui-modal__body" method="dialog" id="modal-invite-form">
        <div class="pui-field">
            <label class="pui-label" for="modal-invite-email">Email address</label>
            <input class="pui-input" id="modal-invite-email" name="email" type="email" placeholder="name@example.com" autofocus />
        </div>
    </form>
    <div class="pui-modal__footer">
        <button class="pui-btn pui-btn--secondary pui-btn--lg" type="button" data-pui-modal-close>Cancel</button>
        <button class="pui-btn pui-btn--primary pui-btn--lg" type="submit" form="modal-invite-form" value="invite">Send invites</button>
    </div>
</dialog>
