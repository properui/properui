<!-- description: Alerts in four tones (info, success, warning, error) with an icon, title, body, actions and a dismiss button (data-pui-dismiss). -->
<div class="pui-alert pui-alert--error" role="alert">
    <svg
        class="pui-alert__icon"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
    >
        <path d="M12 8v4m0 4h.01M22 12c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2s10 4.477 10 10Z" />
    </svg>
    <div class="pui-alert__body">
        <p class="pui-alert__title">Payment failed</p>
        <p>We could not charge the card ending in 4242. Update it to avoid interruptions.</p>
    </div>
    <button class="pui-alert__close" type="button" aria-label="Dismiss" data-pui-dismiss>
        <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <path d="M18 6 6 18M6 6l12 12" />
        </svg>
    </button>
</div>
