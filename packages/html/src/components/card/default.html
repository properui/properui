<!-- description: A card surface with a header (title and description), a body and a footer of actions. -->
<article class="pui-card" aria-labelledby="card-title">
    <header class="pui-card__header">
        <h3 class="pui-card__title" id="card-title">Storage</h3>
        <p class="pui-card__description">Your plan includes 20 GB across all projects.</p>
    </header>
    <div class="pui-card__body">
        <div class="pui-progress">
            <div class="pui-progress__track" role="progressbar" aria-label="Storage used" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100">
                <div class="pui-progress__bar" style="width: 62%"></div>
            </div>
            <span class="pui-progress__label">62%</span>
        </div>
    </div>
    <footer class="pui-card__footer">
        <button class="pui-btn pui-btn--tertiary" type="button">Manage files</button>
        <button class="pui-btn pui-btn--secondary" type="button">Upgrade plan</button>
    </footer>
</article>
