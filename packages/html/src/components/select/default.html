<!-- description: A native <select> with a label and hint; the .pui-select wrapper draws the chevron. -->
<div class="pui-field">
    <label class="pui-label" for="select-country">Country</label>
    <div class="pui-select">
        <select id="select-country" name="country" aria-describedby="select-country-hint">
            <option value="" disabled selected>Select a country</option>
            <option value="au">Australia</option>
            <option value="de">Germany</option>
            <option value="jp">Japan</option>
            <option value="us">United States</option>
        </select>
    </div>
    <p class="pui-hint" id="select-country-hint">Used for tax and currency.</p>
</div>
