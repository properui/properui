<!-- Primary buttons in the four sizes. `pui-btn` alone is primary and sm, as in React. -->
<button class="pui-btn pui-btn--primary pui-btn--sm" type="button">Button sm</button>
<button class="pui-btn pui-btn--primary pui-btn--md" type="button">Button md</button>
<button class="pui-btn pui-btn--primary pui-btn--lg" type="button">Button lg</button>
<button class="pui-btn pui-btn--primary pui-btn--xl" type="button">Button xl</button>
