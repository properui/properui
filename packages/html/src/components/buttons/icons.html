<!-- Leading and trailing icons (mark them data-icon="leading" / "trailing"), an icon-only button (it needs an aria-label), a disabled and a loading button. -->
<button class="pui-btn pui-btn--primary pui-btn--md" type="button">
    <svg
        class="pui-btn__icon"
        data-icon="leading"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
    >
        <path d="M12 5v14m-7-7h14" />
    </svg>
    New project
</button>
<a class="pui-btn pui-btn--secondary pui-btn--md" href="#next">
    Continue
    <svg
        class="pui-btn__icon"
        data-icon="trailing"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
    >
        <path d="M5 12h14m0 0-7-7m7 7-7 7" />
    </svg>
</a>
