<!-- description: An empty state with a featured icon, title, description and two actions. -->
<section class="pui-empty" aria-labelledby="empty-title">
    <div class="pui-empty__icon">
        <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <path d="m21 21-3.5-3.5m2.5-6a8.5 8.5 0 1 1-17 0 8.5 8.5 0 0 1 17 0Z" />
        </svg>
    </div>
    <h3 class="pui-empty__title" id="empty-title">No projects found</h3>
    <p class="pui-empty__description">Your search did not match any projects. Try another term or create a new project.</p>
    <div class="pui-empty__actions">
        <button class="pui-btn pui-btn--secondary pui-btn--md" type="button">Clear search</button>
        <button class="pui-btn pui-btn--primary pui-btn--md" type="button">
            <svg
                class="pui-btn__icon"
                data-icon="leading"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M12 5v14m-7-7h14" />
            </svg>
            New project
        </button>
    </div>
</section>
