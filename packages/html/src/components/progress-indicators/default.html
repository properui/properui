<!-- description: Progress bars with role="progressbar" and ARIA values: md with a trailing percentage label, and sm on its own. -->
<div class="pui-progress">
    <div class="pui-progress__track" role="progressbar" aria-label="Upload progress" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">
        <div class="pui-progress__bar" style="width: 40%"></div>
    </div>
    <span class="pui-progress__label">40%</span>
</div>
<div class="pui-progress pui-progress--sm" role="progressbar" aria-label="Profile completion" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
    <div class="pui-progress__bar" style="width: 75%"></div>
</div>
