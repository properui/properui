<!-- description: A multi-line text field with a label and hint, sharing the input's ring, focus and error states. -->
<div class="pui-field">
    <label class="pui-label" for="textarea-bio">Bio</label>
    <textarea
        class="pui-textarea"
        id="textarea-bio"
        name="bio"
        rows="4"
        placeholder="Write a few sentences about yourself."
        aria-describedby="textarea-bio-hint"
    ></textarea>
    <p class="pui-hint" id="textarea-bio-hint">275 characters left.</p>
</div>
